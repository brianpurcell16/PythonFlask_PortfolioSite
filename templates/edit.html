{% extends 'base.html' %}

{% block content %}
<h2>{% block title %}Edit "{{ project['title'] }}"{% endblock %}</h2>
<hr>

<form method="post">
  <div class="form-group">
    <label for="title">Project Title *</label>
    <input type="text" name="title" class="form-control"
           value="{{ request.form['title'] or project['title'] }}">
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <textarea name="description" class="form-control" rows="4">{{ request.form['description'] or project['description'] }}</textarea>
  </div>

  <div class="form-group">
    <label for="tech_stack">Technologies Used</label>
    <input type="text" name="tech_stack" class="form-control"
           value="{{ request.form['tech_stack'] or project['tech_stack'] }}">
  </div>

  <div class="form-group">
    <label for="github_url">GitHub URL</label>
    <input type="url" name="github_url" class="form-control"
           value="{{ request.form['github_url'] or project['github_url'] }}">
  </div>

  <button type="submit" class="btn btn-primary">Save Changes</button>
  <a href="{{ url_for('projects') }}" class="btn btn-secondary ml-2">Cancel</a>
</form>

<hr>

<!-- Delete button — sends a POST request to the delete route -->
<form action="{{ url_for('delete', id=project['id']) }}" method="post">
  <button type="submit" class="btn btn-danger btn-sm"
          onclick="return confirm('Are you sure you want to delete this project?')">
    Delete Project
  </button>
</form>
{% endblock %}
